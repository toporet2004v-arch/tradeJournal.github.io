<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal</title>
    <style>
        :root {
            --bg: #191919; --text: #d4d4d4; --accent: #2383e2; 
            --green: #0f7b6c; --red: #e03e3e; --card: #252525;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--text);
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 600px; }
        h1 { font-size: 20px; margin-bottom: 20px; text-align: center; }
        
        /* Статистика */
        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card); padding: 15px; border-radius: 8px; text-align: center;
            border: 1px solid #333;
        }
        .stat-val { font-size: 20px; font-weight: bold; margin-top: 5px; }
        .green { color: var(--green); }
        .red { color: var(--red); }

        /* Форма добавления */
        .form-box {
            background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #333;
        }
        input, select, textarea {
            width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px;
            background: #2e2e2e; border: 1px solid #444; color: white; box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%; padding: 10px; background: var(--accent); color: white;
            border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1a6ebd; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Мой Трейдинг Журнал</h1>
    
    <!-- Блок статистики -->
    <div class="stats-grid">
        <div class="stat-card">
            <div style="font-size: 12px; color: #888;">Счет (P&L)</div>
            <div class="stat-val" id="totalPnl">$0.00</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 12px; color: #888;">Win Rate</div>
            <div class="stat-val" id="winRate">0%</div>
        </div>
        <div class="stat-card">
            <div style="font-size: 12px; color: #888;">Сделок</div>
            <div class="stat-val" id="totalTrades">0</div>
        </div>
    </div>

    <!-- Форма -->
    <div class="form-box">
        <h3 style="margin-top: 0;">Новая сделка</h3>
        <input type="text" id="pair" placeholder="Валютная пара (например, EUR/USD)">
        <select id="direction">
            <option value="Long">Long (Покупка)</option>
            <option value="Short">Short (Продажа)</option>
        </select>
        <input type="number" id="pnl" placeholder="Результат (например, 150 или -50)">
        <textarea id="desc" rows="3" placeholder="Описание позы / мысли..."></textarea>
        <input type="file" id="screenshot" accept="image/*" style="border: none; padding: 5px;">
        <button onclick="addTrade()">Сохранить сделку</button>
    </div>
</div>

<script>
    // Загружаем данные из памяти браузера
    let trades = JSON.parse(localStorage.getItem('myTrades')) || [];

    function updateStats() {
        let totalPnl = 0;
        let wins = 0;

        trades.forEach(trade => {
            totalPnl += parseFloat(trade.pnl);
            if (parseFloat(trade.pnl) > 0) wins++;
        });

        let winRate = trades.length > 0 ? (wins / trades.length * 100).toFixed(1) : 0;
        
        const pnlEl = document.getElementById('totalPnl');
        pnlEl.innerText = `$${totalPnl.toFixed(2)}`;
        pnlEl.className = 'stat-val ' + (totalPnl >= 0 ? 'green' : 'red');
        
        document.getElementById('winRate').innerText = `${winRate}%`;
        document.getElementById('totalTrades').innerText = trades.length;
    }

    function addTrade() {
        const pair = document.getElementById('pair').value;
        const direction = document.getElementById('direction').value;
        const pnl = document.getElementById('pnl').value;
        const desc = document.getElementById('desc').value;

        if (!pair || !pnl) {
            alert('Заполни хотя бы пару и результат (P&L)!');
            return;
        }

        const newTrade = {
            pair: pair,
            direction: direction,
            pnl: parseFloat(pnl),
            desc: desc,
            date: new Date().toLocaleDateString()
        };

        trades.push(newTrade);
        localStorage.setItem('myTrades', JSON.stringify(trades));
        
        // Очищаем форму
        document.getElementById('pair').value = '';
        document.getElementById('pnl').value = '';
        document.getElementById('desc').value = '';
        
        updateStats();
        alert('Сделка добавлена!');
    }

    // Инициализация
    updateStats();
</script>

</body>
</html>
